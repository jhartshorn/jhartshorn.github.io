---
layout: default
---

<article class="article h-entry">
  <header class="article-header">
    <h1 class="p-name">{{ page.title | escape }}</h1>
    <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%e %B %Y" }}</time>
  </header>

  <div class="article-body e-content">
    {{ content }}
  </div>

  <footer class="article-footer">
    <a href="{{ '/' | relative_url }}">← Posts</a>
  </footer>
</article>
