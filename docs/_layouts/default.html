<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en-GB' }}">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="shell">
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Posts</a>
          <a href="{{ '/stuff/' | relative_url }}"{% if page.url == '/stuff/' %} aria-current="page"{% endif %}>Stuff</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </nav>
      </div>
    </header>

    <main class="shell" id="main-content">
      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
