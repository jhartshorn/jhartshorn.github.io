---
layout: default
---

<section class="intro" aria-labelledby="intro-title">
  <h1 id="intro-title">{{ site.title }}</h1>
  <p>{{ site.description }}</p>
</section>

<section class="post-list" aria-labelledby="writing-title">
  <h2 class="section-label" id="writing-title">Writing</h2>
  {% for post in site.posts %}
    <article class="post-preview">
      <a href="{{ post.url | relative_url }}">
        <h3>{{ post.title | escape }}</h3>
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%e %B %Y" }}</time>
      </a>
    </article>
  {% endfor %}
</section>
